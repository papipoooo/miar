name: miar-pr7
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: miar
      POSTGRES_PASSWORD: miar_local_only
      POSTGRES_DB: marketplace
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miar -d marketplace"]
      interval: 3s
      timeout: 3s
      retries: 15

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: miar
      RABBITMQ_DEFAULT_PASS: miar_pass
    ports:
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  accounts:
    build:
      context: .
      args: {SERVICE: accounts}
    image: miar-pr7-accounts:local
    environment:
      PORT: 8080
    ports: ["8081:8080"]
    restart: unless-stopped

  catalog:
    build:
      context: .
      args: {SERVICE: catalog}
    image: miar-pr7-catalog:local
    environment:
      PORT: 8080
      DATABASE_URL: postgres://miar:miar_local_only@postgres:5432/marketplace?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["8082:8080"]
    restart: unless-stopped

  carts:
    build:
      context: .
      args: {SERVICE: carts}
    image: miar-pr7-carts:local
    environment:
      PORT: 8080
      CATALOG_URL: http://catalog:8080
    depends_on:
      - catalog
    ports: ["8083:8080"]
    restart: unless-stopped

  delivery:
    build:
      context: .
      args: {SERVICE: delivery}
    image: miar-pr7-delivery:local
    environment:
      PORT: 8080
      ORDERS_URL: http://orders:8080
    ports: ["8084:8080"]
    restart: unless-stopped

  payments:
    build:
      context: .
      args: {SERVICE: payments}
    image: miar-pr7-payments:local
    environment:
      PORT: 8080
      RABBITMQ_URL: amqp://miar:miar_pass@rabbitmq:5672/
    depends_on:
      rabbitmq: {condition: service_healthy}
    ports: ["8085:8080"]
    restart: unless-stopped

  orders:
    build:
      context: .
      args: {SERVICE: orders}
    image: miar-pr7-orders:local
    environment:
      PORT: 8080
      CARTS_URL: http://carts:8080
      DELIVERY_URL: http://delivery:8080
      PAYMENTS_URL: http://payments:8080
      RABBITMQ_URL: amqp://miar:miar_pass@rabbitmq:5672/
    depends_on:
      rabbitmq: {condition: service_healthy}
      carts: {condition: service_started}
      payments: {condition: service_started}
    ports: ["8086:8080"]
    restart: unless-stopped

volumes:
  pgdata:
